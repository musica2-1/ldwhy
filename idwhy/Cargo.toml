[package]
name = "idwhy"
version = "0.1.0"
edition = "2021"
description = "Motor de diagnóstico causal para aplicações Linux: causa raiz ranqueada com nível de confiança"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "=4.4.18", features = ["derive"] }
goblin = "=0.8.0"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
sha2 = "=0.10.8"
